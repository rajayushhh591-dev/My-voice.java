name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf /tmp/mvg
          mkdir -p /tmp/mvg

          unzip -q "$ZIP" -d /tmp/mvg

          echo "Extracted files:"
          find /tmp/mvg -maxdepth 3 -type f -print

          ROOT=$(find /tmp/mvg -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Project folder not found."
            exit 1
          fi

          echo "Project root: $ROOT"

          cp -R "$ROOT"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        run: |
          echo "Project files:"
          ls -la
          echo "App folder:"
          ls -la app

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVoiceGenerator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
